<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membarr — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background-color: #0d1117; }
    .login-card {
      border-color: #30363d;
      background-color: #161b22;
      max-width: 400px;
    }
    .form-control {
      background-color: #0d1117;
      border-color: #30363d;
      color: #c9d1d9;
    }
    .form-control:focus {
      background-color: #0d1117;
      border-color: #58a6ff;
      color: #c9d1d9;
      box-shadow: 0 0 0 0.2rem rgba(88,166,255,.15);
    }
    .form-control::placeholder { color: #6e7681; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="login-card card w-100 mx-3">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-play-circle-fill text-primary" style="font-size:2.5rem;"></i>
        <h4 class="mt-2 fw-bold">Membarr Admin</h4>
        <p class="text-secondary small mb-0">Sign in to manage your media servers</p>
      </div>

      {% if error %}
      <div class="alert alert-danger py-2 small">
        <i class="bi bi-x-circle me-1"></i>{{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login">
        <div class="mb-3">
          <label for="password" class="form-label text-secondary small">Password</label>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="Enter admin password" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
        </button>
      </form>
    </div>
  </div>
</body>
</html>
